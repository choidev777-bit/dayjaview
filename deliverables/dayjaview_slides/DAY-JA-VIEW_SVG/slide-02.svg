<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="서비스 전체 흐름">
  <title>서비스 전체 흐름</title>
  <style>
    @font-face{font-family:'NanumSquare';src:url('assets/NanumSquareR.woff2') format('woff2');font-weight:400;font-style:normal}
    @font-face{font-family:'NanumSquare';src:url('assets/NanumSquareB.woff2') format('woff2');font-weight:700;font-style:normal}
    @font-face{font-family:'NanumSquare';src:url('assets/NanumSquareEB.woff2') format('woff2');font-weight:800;font-style:normal}
    text{font-kerning:normal}
  </style>
  <g id="slide-02" data-title="서비스 전체 흐름">
    <rect x="0" y="0" width="1280" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" data-editable="shape"/>
    <rect x="68" y="46" width="7" height="68" rx="0" fill="#401600" stroke="none" stroke-width="0" data-editable="shape"/>
    <text x="92" y="61.650000000000006" fill="#FD9F28" font-family="NanumSquare, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" data-editable="text"><tspan x="92" dy="0">SERVICE</tspan></text>
    <text x="92" y="103.92" fill="#401600" font-family="NanumSquare, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="start" data-editable="text"><tspan x="92" dy="0">흩어진 탐색을 하나의 분석 흐름으로</tspan></text>
    <text x="1212" y="65.34" fill="#FD9F28" font-family="NanumSquare, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end" data-editable="text"><tspan x="1212" dy="0">02</tspan></text>
    <text x="92" y="156.82000000000002" fill="#000000" font-family="NanumSquare, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-editable="text"><tspan x="92" dy="0">발견 → 원인 확인 → 과거 비교</tspan></text>
    <line x1="116" y1="286" x2="1164" y2="286" stroke="#FD9F28" stroke-width="3" stroke-linecap="round" data-editable="line"/>
    <circle cx="220" cy="286" r="13" fill="#FD9F28" stroke="none" stroke-width="0" data-editable="shape"/>
    <text x="220" y="222.58" fill="#FD9F28" font-family="NanumSquare, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" data-editable="text"><tspan x="220" dy="0">01  DISCOVER</tspan></text>
    <text x="220" y="339.4" fill="#401600" font-family="NanumSquare, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" data-editable="text"><tspan x="220" dy="0">오늘 무엇이</tspan><tspan x="220" dy="29">움직이는가?</tspan></text>
    <rect x="82" y="425" width="276" height="104" rx="18" fill="#401600" stroke="none" stroke-width="0" data-editable="shape"/>
    <text x="220" y="465.56" fill="#FFFFFF" font-family="NanumSquare, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" data-editable="text"><tspan x="220" dy="0">강해지는 테마와</tspan><tspan x="220" dy="28">주도 종목을 발견</tspan></text>
    <circle cx="640" cy="286" r="13" fill="#FD9F28" stroke="none" stroke-width="0" data-editable="shape"/>
    <text x="640" y="222.58" fill="#401600" font-family="NanumSquare, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" data-editable="text"><tspan x="640" dy="0">02  UNDERSTAND</tspan></text>
    <text x="640" y="339.4" fill="#401600" font-family="NanumSquare, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" data-editable="text"><tspan x="640" dy="0">왜</tspan><tspan x="640" dy="29">움직이는가?</tspan></text>
    <rect x="502" y="425" width="276" height="104" rx="18" fill="#FD9F28" stroke="none" stroke-width="0" data-editable="shape"/>
    <text x="640" y="465.56" fill="#FFFFFF" font-family="NanumSquare, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" data-editable="text"><tspan x="640" dy="0">관련 뉴스와 소재를</tspan><tspan x="640" dy="28">같은 화면에서 확인</tspan></text>
    <circle cx="1060" cy="286" r="13" fill="#FD9F28" stroke="none" stroke-width="0" data-editable="shape"/>
    <text x="1060" y="222.58" fill="#FD9F28" font-family="NanumSquare, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" data-editable="text"><tspan x="1060" dy="0">03  STUDY</tspan></text>
    <text x="1060" y="339.4" fill="#401600" font-family="NanumSquare, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" data-editable="text"><tspan x="1060" dy="0">과거에는 어떻게</tspan><tspan x="1060" dy="29">반응했는가?</tspan></text>
    <rect x="922" y="425" width="276" height="104" rx="18" fill="#401600" stroke="none" stroke-width="0" data-editable="shape"/>
    <text x="1060" y="465.56" fill="#FFFFFF" font-family="NanumSquare, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" data-editable="text"><tspan x="1060" dy="0">유사 Event와</tspan><tspan x="1060" dy="28">T+1·5·20 결과 비교</tspan></text>
    <text x="640" y="608.82" fill="#000000" font-family="NanumSquare, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" data-editable="text"><tspan x="640" dy="0">사용자가 직접 연결하던 정보를 하나의 Event 단위로</tspan></text>
    <text x="640" y="642.44" fill="#FD9F28" font-family="NanumSquare, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" data-editable="text"><tspan x="640" dy="0">발견부터 비교까지 끊김 없이 연결합니다.</tspan></text>
    <line x1="68" y1="684" x2="1212" y2="684" stroke="#EEEEEE" stroke-width="2" stroke-linecap="round" data-editable="line"/>
    <text x="68" y="701.41" fill="#401600" font-family="NanumSquare, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.2" data-editable="text"><tspan x="68" dy="0">DAY-JA-VIEW</tspan></text>
