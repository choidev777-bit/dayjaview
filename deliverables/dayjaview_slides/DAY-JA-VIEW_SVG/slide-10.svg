    <text x="1011" y="346.96000000000004" fill="#401600" font-family="NanumSquare, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" data-editable="text"><tspan x="1011" dy="0">2007 ─ 2026</tspan></text>
