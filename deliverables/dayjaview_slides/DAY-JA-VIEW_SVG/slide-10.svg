    <text x="1011" y="490.16" fill="#FFFFFF" font-family="NanumSquare, Arial, sans-serif" font-size="36" font-weight="800" text-anchor="middle" data-editable="text"><tspan x="1011" dy="0">약 20년</tspan></text>
    <text x="1011" y="526.65" fill="#FFFFFF" font-family="NanumSquare, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" data-editable="text"><tspan x="1011" dy="0">같은 소재의 반복과 반응을 비교</tspan></text>
    <text x="640" y="622.82" fill="#401600" font-family="NanumSquare, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" data-editable="text"><tspan x="640" dy="0">하지만 데이터를 많이 모았다고 바로 ‘데자뷰 분석’이 되는 것은 아닙니다.</tspan></text>
