name: contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "docs/api_contract.md"
      - "scripts/validate_contracts.py"
      - "tests/contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/contracts.yml"
  push:
    paths:
      - "contracts/**"
      - "docs/api_contract.md"
      - "scripts/validate_contracts.py"
      - "tests/contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --frozen --group dev
      - name: Validate machine contracts
        run: uv run python scripts/validate_contracts.py
      - name: Run focused contract tests
        run: uv run pytest tests/contracts -q
