[project]
name = "dayjaview-contracts"
version = "0.1.0"
description = "DAYJAVIEW의 기계 검증 가능한 Stage 0 계약"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "openapi-spec-validator==0.7.2",
  "PyYAML==6.0.2",
  "websockets==17.0.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
