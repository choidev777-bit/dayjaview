[project]
name = "dayjaview-contracts"
version = "0.1.0"
description = "DAYJAVIEW의 기계 검증 가능한 Stage 0 계약"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "openapi-spec-validator==0.7.2",
  "psycopg[binary]==3.3.4",
  "PyYAML==6.0.2",
  "uvicorn==0.52.3",
  "websockets==17.0.1",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.0.3",
  "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["docs", "data", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Script-style entry points insert sys.path before imports.
"apps/worker-market/**" = ["E402"]
"apps/worker-batch/**" = ["E402"]
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["packages", "apps/api"]
exclude = [
  "packages/reference-data",
]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
disable_error_code = ["redundant-cast"]
